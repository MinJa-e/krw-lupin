name: Build and verify deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krw-lupin-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, browser smoke, and Render health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production client
        run: npm run build

      - name: Build browser smoke bundle
        run: npm run build:e2e

      - name: Check browser startup and sit/stand controls
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREVIEW_DIR: dist-e2e

      - name: Wait for this commit on Render and check Socket.IO
        run: npm run verify:deploy
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RENDER_BASE_URL: https://krw-lupin.onrender.com
          DEPLOY_VERIFY_TIMEOUT_MS: 720000

      - name: Check deployed website in Chromium
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://krw-lupin-web.onrender.com/

      - name: Upload browser failure details
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: krw-lupin-playwright-results
          path: test-results/
          if-no-files-found: ignore
