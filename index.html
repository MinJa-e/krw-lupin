<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>krw-lupin</title>
</head>

<body>
  <div id="app">

  </div>
  <div id="speech-bubble"></div>
  <div id="player-name"></div>

  <!-- 점심추천 강아지 상호작용 안내 -->
  <div id="chat">
    <div id="chat-messages">
      <div class="chat-system">채팅에 오신 것을 환영합니다!</div>
    </div>
    <input id="chat-nickname" type="text" placeholder="닉네임을 입력하세요" value="플레이어" maxlength="12" />
    <form id="chat-form">
      <textarea id="chat-input" placeholder="메시지를 입력하세요..." maxlength="100" autocomplete="off" rows="1"></textarea>
      <button type="submit">전송</button>
    </form>
  </div>
  <!-- 채팅창 열기/닫기 버튼 -->
<button id="chat-toggle">💬 채팅 숨기기</button>


<div id="dog-interaction-buttons" style="display: none;">
  <button id="dog-interaction-button">
    🍱 점심 메뉴 추천
  </button>

  <button id="lotto-interaction-button">
    🎱 로또 번호 추천
  </button>
</div>

<!-- 해변 돌탑 쌓기 -->
<div id="stone-tower-buttons" style="display: none;">
  <button id="stone-tower-button">
    🪨 돌탑 쌓기
  </button>
  <button id="stone-tower-collapse-button">
    💥 무너뜨리기
  </button>
  <span id="stone-tower-counter">0</span>
</div>

<!-- 캐릭터 색상 꾸미기 -->
<button id="appearance-button" type="button" aria-label="캐릭터 꾸미기">🎨</button>
<div id="appearance-panel" style="display: none;">
  <div class="appearance-panel-title">🎨 캐릭터 꾸미기</div>
  <div class="appearance-hint" id="appearance-hint">색을 바꿀 부위: 상의</div>
  <div class="appearance-parts" id="appearance-parts">
    <button type="button" class="appearance-part" data-part="skin">피부</button>
    <button type="button" class="appearance-part" data-part="hair">머리</button>
    <button type="button" class="appearance-part selected" data-part="shirt">상의</button>
    <button type="button" class="appearance-part" data-part="pants">하의</button>
    <button type="button" class="appearance-part" data-part="shoes">신발</button>
  </div>
  <label class="appearance-custom-row">직접 선택 <input type="color" id="appearance-custom" value="#ffffff"></label>
  <div class="appearance-swatches" id="appearance-swatches">
    <button type="button" class="appearance-swatch" data-color="#ffffff" style="background: #ffffff" aria-label="흰색"></button>
    <button type="button" class="appearance-swatch" data-color="#000000" style="background: #000000" aria-label="검은색"></button>
    <button type="button" class="appearance-swatch" data-color="#ffd0ad" style="background: #ffd0ad" aria-label="백인 피부색"></button>
    <button type="button" class="appearance-swatch" data-color="#fcaf79" style="background: #fcaf79" aria-label="황인 피부색"></button>
    <button type="button" class="appearance-swatch" data-color="#e79055" style="background: #e79055" aria-label="까무잡잡 피부색"></button>
    <button type="button" class="appearance-swatch" data-color="#b15d25" style="background: #b15d25" aria-label="흑인 피부색"></button>
  </div>
  <div class="appearance-panel-actions">
    <button id="appearance-reset" type="button">초기화</button>
    <button id="appearance-close" type="button">닫기</button>
  </div>
</div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
